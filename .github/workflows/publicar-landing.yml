# ============================================================
# 1. PUBLICAR LANDING NO GITHUB PAGES
# Push na main mexendo em landing/ = GitHub instala, roda build e publica landing/dist.
# Mudança só em frontend/ ou backend/ não dispara.
# Botão "Run workflow" na aba Actions roda de novo sem push.
# Requer Settings → Pages → Source = GitHub Actions.
# ============================================================

name: Publicar landing no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/publicar-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist
      - id: publicacao
        uses: actions/deploy-pages@v4
